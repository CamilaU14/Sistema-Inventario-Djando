{% extends "inventario/base.html" %}

{% block contenido %}
<h1 class="h3 mb-4">{{ titulo }}</h1>

<p>
    ¿Deseas eliminar el registro <strong>{{ registro }}</strong>?
</p>

<p class="text-muted">
    Esta acción no se puede deshacer.
</p>

<form method="post">
    {% csrf_token %}

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger">
            Sí, eliminar
        </button>

        <a
            href="{% url 'inventario:listado' modulo=modulo %}"
            class="btn btn-outline-secondary"
        >
            Cancelar
        </a>
    </div>
</form>
{% endblock %}
